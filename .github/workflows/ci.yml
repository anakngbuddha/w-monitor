name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Fail closed if a test resolves OS-default credential/data paths (V22).
  WMONITOR_TEST_ISOLATION: "1"
  # Pinned scanners — do not use @latest (L17).
  STATICCHECK_VERSION: "v0.6.1"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  test:
    # The collector reads OS-specific interfaces, connection tables, and disk
    # counters, so Linux-only CI would miss half the risk surface.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Record toolchain and module graph
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::go version / env"
          go version
          go env GOTOOLCHAIN GOOS GOARCH GOROOT
          echo "::endgroup::"
          echo "::group::go mod verify"
          go mod verify
          echo "::endgroup::"
          echo "::group::selected modules (go list -m all)"
          go list -m all
          echo "::endgroup::"

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Isolation env is inherited from workflow env. fail-fast is false so a
      # Windows failure does not hide a Linux failure (L17).
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: staticcheck (pinned)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck ./...

      - name: govulncheck (pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...
