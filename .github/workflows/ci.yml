name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting (including pre-existing baseline issues)
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Record source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          go version
          go env GOTOOLCHAIN GOOS GOARCH
          go list -m -json all > modules.json
      - name: Verify module checksums
        run: go mod verify
      - name: Test-path safety preflight
        run: go test ./agent -run '^TestNoProductionPathCallsInTests$' -count=1
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Focused credential and spool isolation regressions
        run: go test -race ./agent -run 'TestCredential|TestAgentExplicitDirectory' -count=1 -timeout=3m
      - name: Full race-enabled suite
        run: go test -race ./... -count=1 -timeout=10m
      - name: Retain selected module inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.os }}
          path: modules.json
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
